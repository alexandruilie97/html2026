<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/ap3.css">
</head>
<body>

    <h1>Formular inregistrare</h1>
    <form action="">
        <div>
        <label for="name">Nume</label>
        <input type="text" id="name" name="name" placeholder="Va rugam introduceti numele">
        </div>
        <div>
            <label for="surname">Prenume</label>
            <input type="text" id="surname" name="surname" placeholder="Va rugam introduceti prenume">
        </div>
        <div>
            <label for="email">Email</label>
            <input type="email" name="email" id="email" placeholder="Va rugam introduceti emailul">
        </div>
        <div>
            <label for="parola">Parola</label>
            <input type="password" name="parola" id="parola">
        </div>
        <div id="check">
            <label for="checkbox">Sunt de acord cu termenii si condutile</label>
            <input type="checkbox" name="checkbox" id="checkbox">
        </div>
        <div>
            <label for="trimite"></label>
            <input type="submit" value="Inregistreaza datele" id="trimite">
        </div>
    </form>
</body>
</html>

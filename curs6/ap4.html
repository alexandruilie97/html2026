<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/ap4.css">
</head>
<body>
    <h2>Formular de contact</h2>
    <form action="" method="post" enctype="multipart/form-data">
        <div>
            <label for="oras">Selecteaza orasul</label>
            <select name="oras" id="oras" required>
                <option value="1">Bucuresti</option>
                <option value="2">Pitesti</option>
                <option value="3">Craiova</option>
                <option value="4">Timisoara</option> 
            </select>
        </div>
        <div>
            <label for="cursuri">Cursuri</label>
            <select name="cursuri" id="cursuri" multiple>
                <option value="php">PHP</option> 
                <option value="js">JavaScript</option>
                <option value="css">CSS</option>
                <option value="html">HTML</option>
            </select> 
        </div>
        <div>
            <label for="text">Mesaj</label>
            <textarea name="text" id="text" cols="30" rows="10"></textarea>
        </div>
        <div>
            <label for="cv">CV</label>
            <input type="file" name="cv" id="cv">
        </div>
        <fieldset>
            <legend>Program cursuri</legend>
            <label for="dimineata">Dimineata</label>
            <input type="radio" name="program" id="dimineata" value="dimineata">
            <label for="pranz">Pranz</label>
            <input type="radio" name="program" id="pranz" value="pranz">
            <label for="seara">Seara</label>
            <input type="radio" name="program" id="seara" value="seara" checked>
        </fieldset>
        <div>
            <input type="checkbox" name="termeni" id="termeni" value="1">
            <label for="termeni">Termeni si conditii</label>

            <input type="checkbox" name="abonat" id="abonat">
            <label for="abonat">Ma abonez</label>
        </div>
        <div>
            <input type="submit" value="Trimite date">
        </div>
    </form>
</body>
</html>
